<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爸爸生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    width:100vw;height:100vh;
    background:linear-gradient(120deg,#f093fb,#f5576c);
    overflow:hidden;
    font-family:"华文行楷",sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
.box{
    background:rgba(255,255,255,0.2);
    padding:50px 80px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    text-align:center;
}
.t1{
    font-size:56px;
    color:#fff;
    text-shadow:3px 3px 6px #666;
    letter-spacing:6px;
}
.t2{
    font-size:38px;
    color:#fff;
    margin:20px 0;
}
.t3{
    font-size:36px;
    color:#ffe4e1;
}
.heart{
    position:absolute;
    font-size:22px;
    color:#fff;
    animation:fall linear infinite;
}
@keyframes fall{
    0%{top:-30px;opacity:1;}
    100%{top:100vh;opacity:0;}
}
</style>
</head>
<body>
<div class="box">
    <div class="t1">杨永军 生日快乐</div>
    <div class="t2">爸爸辛苦了</div>
    <div class="t3">身体健康 长命百岁</div>
</div>

<!-- 生日快乐背景音乐 循环播放 -->
<audio id="bg" loop preload="auto">
    <source src="https://freetestdata.com/wp-content/uploads/2021/09/Happy_Birthday_to_You.mp3" type="audio/mpeg">


<script>
// 爱心飘落
function create(){
    let d=document.createElement("div");
    d.className="heart";d.innerHTML="❤️";
    d.style.left=Math.random()*100+"vw";
    d.style.animationDuration=Math.random()*4+2+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),7000);
}
setInterval(create,200);

// 点击页面任意位置播放生日歌（解决浏览器禁止自动播放）
document.body.addEventListener("click",()=>{
    const music = document.getElementById("bg");
    music.play();
});
</script>
</body>
</html>
